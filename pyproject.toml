[project]
name = "vertex-deployer"
version = "0.5.5"
description = "Check, compile, upload, run, and schedule Kubeflow Pipelines on GCP Vertex AI in a standardized manner."
authors = [
    {name = "artefactory", email = "jules.bertrand@artefact.com"},
    {name = "julesbertrand", email = "jules.bertrand@artefact.com"},
]
license = "Apache-2.0"
readme = "README.md"
keywords = ["kubeflow", "vertexai", "aiplatform", "gcp", "mlops", "deployer", "pipeline"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "kfp>=2.0.1,<3.0",
    "google-cloud-aiplatform>=1.26,<2.0",
    "requests>=2.31,<3.0",
    "typer>=0.12,<0.13",
    "click>=8.0,<8.2",
    "rich>=13.5,<14.0",
    "loguru>=0.7,<0.8",
    "pydantic-settings>=2.0,<2.9.0",
    "pydantic>=2.3,<3.0",
    "toml>=0.10,<0.11",
    "tomlkit>=0.12,<0.14",
    "jinja2>=3.1.3,<4.0",
    "numpy>1.24",
]

[project.optional-dependencies]
profiling = ["pyinstrument>=4.5,<6.0"]

[project.scripts]
vertex-deployer = "deployer.cli:app"

[project.urls]
Homepage = "https://github.com/artefactory/vertex-pipelines-deployer"
Documentation = "https://artefactory.github.io/vertex-pipelines-deployer/"
Repository = "https://github.com/artefactory/vertex-pipelines-deployer"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pre-commit>=3.3,<4.0",
    "ipykernel>=6.9,<7.0",
    "nbstripout>=0.7,<0.8",
    "ruff>=0.6",
    "pytest-cov>=5.0,<6.0",
    "codespell>=2.2,<3.0",
]
docs = [
    "mkdocs>=1.5,<2.0",
    "mkdocs-material>=9.5.17,<10.0",
    "mkdocstrings>=0.26,<0.27",
    "mkdocstrings-python>=1.13.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deployer"]

[tool.ruff]
target-version = "py310"
line-length = 99
exclude = [
    "deployer/_templates/*",
]

[tool.ruff.lint]
ignore = [
    "D100",
    "D205",
    "D415",
]
select = [
    "B",    # bugbear
    "C4",   # comprehensions
    "C90",  # mccabe
    "D",    # docstrings
    "E",    # flake8
    "F",    # flake8
    "W",    # flake8
    "S",    # bandit
    "N",    # pep8-naming
    "RUF",  # ruff
    "I",    # isort
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["vertex", "tests", "deployer"]

[tool.ruff.lint.per-file-ignores]
"*cli.py" = ["D", "B008"]
"*__init__.py" = [
    "F401",
    "D100",
    "D101",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
]
"tests/*" = ["D", "S101"]

[tool.semantic_release]
version_variables = ["deployer/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
upload_to_pypi = false
upload_to_release = true
build_command = "pip install uv && uv build"
commit_message = "chore(release): {version}\n\n[skip ci]\nAutomatically generated by semantic-release"
tag_format = "{version}"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = ['''^chore\(release\).*''']

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "enh",
    "feat",
    "fix",
    "perf",
    "style",
    "refactor",
    "test",
]
minor_tags = ["feat"]
patch_tags = ["build", "enh", "fix", "perf"]


[tool.vertex_deployer]
log_level = "DEBUG"

[tool.vertex_deployer.list]
with_configs = true
